name: Commit lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-lint:
    name: Validate PR commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
      - name: Iterate PR commits and fail on any non-conforming message
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log -z --format=%B "$BASE_SHA..$HEAD_SHA" | go run ./cmd/release-tool validate-commits
